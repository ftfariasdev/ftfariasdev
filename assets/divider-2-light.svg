<svg xmlns="http://www.w3.org/2000/svg" width="830" height="28" role="img" viewBox="0 0 830 28"><title>Section divider</title><desc>A pulse of current runs along a string of solar modules into a junction box.</desc><style>@keyframes travel{0%{opacity:1;stroke-dashoffset:30}50%{opacity:1;stroke-dashoffset:-798}50.01%,to{opacity:0}}@keyframes charge{0%,16%,to{fill:#c9d6ee}4%{fill:#b84e08}}@keyframes arrive{0%,44%,70%,to{opacity:.45}52%{opacity:1}}.pulse{opacity:0;animation:travel 5s linear infinite backwards}.module{animation:charge 5s linear infinite backwards}.node{animation:arrive 5s cubic-bezier(.37,0,.63,1) infinite backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path stroke="#1f3f8f" stroke-width="1.5" d="M8 14h798"/><g fill="#c9d6ee" stroke="#1f3f8f"><rect width="22" height="12" x="58" y="8" class="module" rx="2" style="animation-delay:-1.684s"/><rect width="22" height="12" x="92" y="8" class="module" rx="2" style="animation-delay:-1.577s"/><rect width="22" height="12" x="126" y="8" class="module" rx="2" style="animation-delay:-1.471s"/><rect width="22" height="12" x="160" y="8" class="module" rx="2" style="animation-delay:-1.364s"/><rect width="22" height="12" x="194" y="8" class="module" rx="2" style="animation-delay:-1.258s"/><rect width="22" height="12" x="228" y="8" class="module" rx="2" style="animation-delay:-1.151s"/><rect width="22" height="12" x="262" y="8" class="module" rx="2" style="animation-delay:-1.045s"/><rect width="22" height="12" x="296" y="8" class="module" rx="2" style="animation-delay:-.938s"/><rect width="22" height="12" x="330" y="8" class="module" rx="2" style="animation-delay:-.832s"/><rect width="22" height="12" x="364" y="8" class="module" rx="2" style="animation-delay:-.725s"/><rect width="22" height="12" x="398" y="8" class="module" rx="2" style="animation-delay:-.619s"/><rect width="22" height="12" x="432" y="8" class="module" rx="2" style="animation-delay:-.512s"/><rect width="22" height="12